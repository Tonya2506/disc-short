  /* ═════════ СОБЫТИЯ ═════════ */
  root.addEventListener('click', function (e) {
    flushLeave(); // незавершённый уход доигрывается сразу, новое действие применяется поверх
    var el = e.target.closest('[data-act]');
    if (SES.menu && (!el || el.dataset.act !== 'menu') && !e.target.closest('.menu')) { SES.menu = false; if (!el) { render(); return; } }
    if (!el || el.disabled) return;
    var a = el.dataset.act, d = el.dataset, u = S.ui;
    if (a === 'modal-close-bg' && e.target !== el) return;
    switch (a) {
      case 'home':
        if (u.screen === 'home') break; // Правка «Где я»: уже на главной — нажатие ничего не делает
        if (u.screen === 'tour') { tourFinish(); break; } // Чистка: «Главная» во время экскурсии завершает её
        if (u.screen === 'type' && flyBegin(root.querySelector('.card-hd .bigL'), 'badge', u.type)) { // из карточки буква летит обратно в свой сектор
          var back = u.type; leave('.main', 'out', 150, function () { go('home'); flyLand('.sq.' + back + ' .L', 'letter'); }); break;
        }
        go('home'); break;
      case 'menu': SES.menu = !SES.menu; render(); break;
      case 'fin-again': finVolley(); break;
      case 'fin-next': pressNext(); break;
      case 'sec': if (secOpen(d.sec)) openSec(d.sec); break;
      case 'route-go': openSec(curStep() || 'about'); break;
      // Правка «Без правой части шапки»: действия route-prev и route-next удалены — кнопок «←» и «Дальше» больше нет
      case 'continue': pressContinue(); break;
      case 'open-type':
        if (!secOpen(d.type)) break;
        if (flyBegin(el.querySelector('.L'), 'letter', d.type)) { // буква из сектора (или колонки) летит в плашку карточки
          leave('.main', 'out', 150, function () { go('type', { type: d.type }); flyLand('.card-hd .bigL', 'badge'); }); break;
        }
        go('type', { type: d.type }); break;
      case 'type-select': go('type-select'); break;
      case 'about-next': SES.aboutFrom = Math.max(1, S.progress.about); /* Правка «О модели»: анимация от текущего шага */ if (S.progress.about < 5) S.progress.about++; SES.aboutOpen = null; S.ui.aboutStep = S.progress.about; storage.save(); render(); break;
      case 'tab': // 4: полоса едет сразу, текст растворяется и появляется новый
        var nt = +d.tab; if (nt === u.tab) break;
        var ink = root.querySelector('.tab-ink'); if (ink && FX.inkPos) { var p = inkTo(el); inkSet(ink, p); FX.inkPos = p; }
        leave('.tabbody', 'out', 120, function () { FX.tabFade = true; u.tab = nt; u.page = 1; markTab(u.type, u.tab); storage.save(); render(); }); break;
      case 'type-sw': // 6
        var nT = d.type; if (nT === u.type) break;
        leave('.card-hd, .tabbody', 'out', 120, function () { FX.typeSw = FX.tabFade = true; u.type = nT; u.page = 1; markTab(u.type, u.tab); storage.save(); render(); }); break;
      case 'rule': // Правка «Как говорить»: выбор правила в списке — правая часть коротко растворяется и плавно приходит новая
        var nr = +d.page; if (nr === (u.page || 1)) break;
        leave('.tk-c', 'out', 120, function () {
          var was = S.progress.tabs[u.type].indexOf(3) >= 0;
          FX.pageDir = 1; u.page = nr; markTab(u.type, 3); storage.save(); render();
          if (!was && S.progress.tabs[u.type].indexOf(3) >= 0) heroCelebrate(u.type); // Правка «Герои»: жест героя + салют рядом с ним
        }); break;
      case 'page': // 5: правила уходят и приходят по направлению листания
        var np = +d.page, cp = u.page || 1; if (np === cp) break;
        leave('.rules .rule, .tabbody .note', np > cp ? 'out-f' : 'out-b', 160, function () { FX.pageDir = np > cp ? 1 : -1; u.page = np; markTab(u.type, 3); storage.save(); render(); }); break;
      case 'about-open': SES.aboutFrom = SES.aboutOpen || Math.max(1, S.progress.about); /* Правка «О модели»: анимация от текущего шага */ SES.aboutOpen = +d.i; S.ui.aboutStep = +d.i; storage.save(); render(); break;
      case 'compare-all': go('compare'); break;
      case 'aspect': // Правка «Сборка теории»: полоска едет под выбранную вкладку, зона растворяется и приходит новая
        var na = +d.aspect; if (na === u.aspect) break;
        var ink2 = root.querySelector('.tab-ink'); if (ink2 && FX.inkPos) { var p2 = inkTo(el); inkSet(ink2, p2); FX.inkPos = p2; }
        cmpSel(null);
        leave('.cmp-zone', 'out', 120, function () { FX.tabFade = true; u.aspect = na; storage.save(); render(); }); break;
      case 'compare-col': // когда собрано всё — колонка открывает карточку типа; пока нет — это мишень для выбранной карточки
        if (u.screen !== 'compare' || secDone('compare')) go('type', { type: d.type, returnTo: linear() ? { screen: 'compare', aspect: u.aspect } : null });
        else if (CMP.sel) cmpAttempt(CMP.sel, el);
        break;
      case 'cmp-card': if (e.detail === 0) cmpToggle(el); break; // с клавиатуры; мышью карточки обрабатываются через pointer-события
      case 'ret': var r = u.returnTo; restoreCtx(r); break;
      case 'card-trainer': startMix(u.type, { screen: 'type', type: u.type, tab: u.tab }); break; // Правка «Тренировка на типе»: сразу раунд по типу, без экрана форматов
      case 'card-pair': go('pair-select', { other: u.type, returnTo: { screen: 'type', type: u.type, tab: u.tab } }); break;
      case 'card-prep': go('prep', { prepType: u.type, returnTo: { screen: 'type', type: u.type, tab: u.tab } }); break;
      // главная full
      case 'tip-more': nextTip(); render(); break;
      case 'tip-details': var tp = CT.tips.filter(function (t) { return t.id === SES.tip; })[0]; go('type', { type: tp.type, tab: tp.tab, returnTo: { screen: 'home' } }); break;
      case 'act-prep': go('prep'); break;
      case 'act-quiz': quizEntry(); break;
      case 'act-trainer': go('trainer-formats'); break;
      case 'act-pair': go('pair-select'); break;
      // подготовка
      case 'prep-type': S.prep.type = d.type; storage.save(); render(); break;
      case 'prep-goal': S.prep.goal = d.goal; storage.save(); render(); break;
      case 'prep-all': go('type', { type: S.prep.type, tab: 3, returnTo: { screen: 'prep', prepType: S.prep.type, goal: S.prep.goal } }); break;
      // опросник
      case 'quiz-start': case 'quiz-restart': case 'quiz-again':
        S.quiz.answers = {}; S.quiz.current = 1; S.quiz.inProgress = true; S.quiz.order = newOrder(); goNow('quiz-question'); break;
      case 'quiz-pick': S.quiz.answers[S.quiz.current === 13 ? 'x' : Q[S.quiz.current - 1].id] = d.type; storage.save(); render(); break;
      case 'quiz-back': if (S.quiz.current > 1) { S.quiz.current--; storage.save(); render(); } break;
      case 'quiz-fwd': quizForward(); break;
      case 'quiz-card': go('type', { type: S.quiz.leader, returnTo: { screen: 'quiz-result' } }); break;
      case 'quiz-pair': go('pair-select', { self: S.quiz.leader }); break;
      // тренажёр
      // Правка «Тренировка на типе»: действие tr-unfilter удалено вместе с плашкой фильтра
      case 'tr-start': startRound(d.f); break;
      case 'tr-ans': var t = SES.tr.queue[SES.tr.index - 1]; answerTask(t.f === 'yesNo' ? d.v === '1' : d.v); break;
      case 'tr-next': if (SES.tr.index < SES.tr.queue.length) { SES.tr.index++; SES.tr.answer = null; goIn('trainer-task'); } else finishRound(); break;
      case 'tr-check': SES.tr.correct = SES.tr.order.filter(function (id) { return SES.tr.board[id] === STM[id].type; }).length; goIn('trainer-board-feedback'); break;
      case 'tr-finish': finishRound(); break;
      case 'tr-again': if (SES.tr.format === 'mix') startMix(SES.tr.mixType); else startRound(SES.tr.format); break; // Правка «Тренировка на типе»
      case 'tr-formats': goNow('trainer-formats', SES.tr.format === 'mix' ? { returnTo: SES.tr.mixFrom } : { keepReturn: true }); break; // Правка «Тренировка на типе»: из раунда по типу — со ссылкой назад в карточку
      case 'mix-back': restoreCtx(SES.tr.mixFrom); break; // Правка «Тренировка на типе»: вернуться в карточку, откуда запускали
      case 'tr-exit': guard(function () { if (SES.tr.format === 'mix' && SES.tr.mixFrom) restoreCtx(SES.tr.mixFrom); else goNow('trainer-formats', { keepReturn: true }); }); break; // Правка «Тренировка на типе»: из раунда по типу — назад в карточку
      // мы с тобой
      case 'pair-self': SES.pair.self = d.type; render(); break;
      case 'pair-other': SES.pair.other = d.type; render(); break;
      case 'pair-card': go('type', { type: d.type, returnTo: { screen: 'pair-select', self: SES.pair.self, other: SES.pair.other } }); break;
      // faq / экскурсия
      case 'faq': SES.modal = { kind: 'faq' }; SES.menu = false; render(); break;
      case 'modal-close': case 'modal-close-bg': SES.modal = null; SES.confirmFn = null; render(); break;
      case 'confirm-yes': var fn = SES.confirmFn; SES.modal = null; SES.confirmFn = null; if (fn) fn(); else render(); break;
      // Правка «Экскурсия»: действие tour-run удалено вместе с кнопкой
      case 'tour-next': if (SES.tourStep < CT.tour.length - 1) { SES.tourStep++; render(); } else tourFinish(); break;
      case 'tour-skip': tourFinish(); break;
      case 'dev-lightbox': location.reload(); break;
    }
  });
  function quizForward() {
    var q = S.quiz;
    if (q.current < 12) { q.current++; }
    else if (q.current === 12) {
      var c = counts(false), t = tiedTop(c);
      if (t.length > 1) { // ПП-5.11: ничья → дополнительный вопрос (варианты только лидеров)
        if (!q.order.x || q.order.x.split('').sort().join('') !== t.slice().sort().join('')) { q.order.x = shuffle(t).join(''); delete q.answers.x; }
        q.current = 13;
      } else { finishQuiz(c); return; }
    } else if (q.current === 13) { finishQuiz(counts(true)); return; }
    storage.save(); render();
  }
  function finishQuiz(c) {
    var q = S.quiz, total = TYPES.reduce(function (s, t) { return s + c[t]; }, 0);
    q.result = {}; TYPES.forEach(function (t) { q.result[t] = c[t] / total; });
    q.leader = tiedTop(c)[0]; // по сырым баллам (СОСТ-5.3); после доп. вопроса лидер один
    q.completedAt = Date.now(); q.inProgress = false; q.answers = {}; q.order = {}; q.current = 1;
    goNow('quiz-result');
  }

  // Правка «Подсказки осей»: обработчики наведения на ось (МЕХ-2.2 / 2.3) удалены — подсказок больше нет
  // drag-and-drop «Собери портрет»
  root.addEventListener('dragstart', function (e) { var s = e.target.closest('.stm[data-id]'); if (s) { e.dataTransfer.setData('text/plain', s.dataset.id); e.dataTransfer.effectAllowed = 'move'; } });
  root.addEventListener('dragover', function (e) { var z = e.target.closest('[data-drop]'); if (z) { e.preventDefault(); z.classList.add('over'); } });
  root.addEventListener('dragleave', function (e) { var z = e.target.closest('[data-drop]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
  root.addEventListener('drop', function (e) {
    var z = e.target.closest('[data-drop]'); if (!z) return; e.preventDefault();
    var id = e.dataTransfer.getData('text/plain'); if (!STM[id]) return;
    if (z.dataset.drop === 'tray') delete SES.tr.board[id]; else SES.tr.board[id] = z.dataset.drop;
    render();
  });
  window.addEventListener('pagehide', function () { storage.save(); if (store.exit) store.exit(); });


  /* ═════ Экран «Справочник пройден»: салют и четыре героя ═════
     Слой лежит поверх кадра, вне #root (он перерисовывается целиком), обрезается по краям кадра и не двигает ни одного блока.
     Все движения — transform и opacity; при «уменьшить движение» конфетти не летит (неподвижная россыпь), герои стоят в ряду. */
  var finSync = function () { }, finVolley = function () { };
  (function () {
    var FIN = { layer: null, cv: null, ctx: null, parts: [], raf: 0, last: 0, heroes: {}, gen: 0, timers: [], lastFire: -1e9, W: 960, H: 540 };
    var COLORS = ['#E0574C', '#F0B82E', '#3DAA78', '#4B7FE0', '#B3DBC0', '#67BACA'];
    var HCOL = { D: '#E0574C', I: '#F0B82E', S: '#3DAA78', C: '#4B7FE0' }, ORDER = ['D', 'I', 'S', 'C'];
    function rnd(a, b) { return a + Math.random() * (b - a); }
    function at(fn, ms, g) { FIN.timers.push(setTimeout(function () { if (g === FIN.gen) fn(); }, ms)); }

    /* салют: один залп из трёх «пушек» (слева, справа, снизу по центру) */
    function burst(x, y, ang, spread, n, v0, v1, delay) {
      for (var i = 0; i < n; i++) {
        var a = (ang + rnd(-spread, spread)) * Math.PI / 180, v = rnd(v0, v1), shape = Math.random();
        FIN.parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: rnd(0, 6.28), vr: rnd(-4, 4), flip: rnd(0, 6.28), vf: rnd(2, 5.5),
          w: rnd(6, 11), h: rnd(4, 7), shape: shape < .62 ? 0 : shape < .82 ? 1 : 2, c: COLORS[(Math.random() * COLORS.length) | 0],
          sp: rnd(0, 6.28), sf: rnd(2, 4), sa: rnd(18, 46), wait: delay, age: 0, life: rnd(5.5, 7) });
      }
    }
    function drawPart(ctx, p, alpha) {
      ctx.save(); ctx.globalAlpha = alpha; ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.flip)); ctx.fillStyle = p.c;
      if (p.shape === 0) ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      else if (p.shape === 1) { ctx.beginPath(); ctx.arc(0, 0, p.h * .62, 0, 6.283); ctx.fill(); }
      else ctx.fillRect(-1.5, -8, 3, 16);
      ctx.restore();
    }
    function tick(t) {
      if (!FIN.layer) { FIN.raf = 0; return; }
      var ctx = FIN.ctx, W = FIN.W, H = FIN.H, dt = Math.min(.033, (t - FIN.last) / 1000 || .016); FIN.last = t;
      ctx.clearRect(0, 0, W, H);
      FIN.parts = FIN.parts.filter(function (p) { return p.age < p.life && p.y < H + 30; });
      FIN.parts.forEach(function (p) {
        if (p.wait > 0) { p.wait -= dt; return; }
        p.age += dt;
        p.vx = p.vx * Math.exp(-2 * dt) + Math.sin(p.age * p.sf + p.sp) * p.sa * dt;
        p.vy = p.vy * Math.exp(-2.3 * dt) + 250 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.flip += p.vf * dt;
        var fade = p.life - p.age < 1 ? (p.life - p.age) / 1 : 1, appear = Math.min(1, p.age / .18);
        drawPart(ctx, p, Math.max(0, Math.min(fade, appear)));
      });
      if (FIN.parts.length) FIN.raf = requestAnimationFrame(tick); else { FIN.raf = 0; ctx.clearRect(0, 0, W, H); }
    }
    function still() {
      var ctx = FIN.ctx, W = FIN.W, H = FIN.H; ctx.clearRect(0, 0, W, H); FIN.cv.classList.add('still'); FIN.cv.classList.remove('on');
      for (var i = 0; i < 90; i++) drawPart(ctx, { x: rnd(20, W - 20), y: rnd(20, H * .78), rot: rnd(0, 6.28), flip: rnd(0, 1.2), w: rnd(6, 11), h: rnd(4, 7), shape: Math.random() < .7 ? 0 : 1, c: COLORS[(Math.random() * COLORS.length) | 0] }, .9);
      void FIN.cv.offsetWidth; FIN.cv.classList.add('on');
    }
    finVolley = function () {
      if (!FIN.layer) return;
      var now = performance.now(); if (now - FIN.lastFire < 500) return; FIN.lastFire = now;
      if (REDUCED.matches) { still(); return; }
      var W = FIN.W, H = FIN.H;
      burst(26, H + 6, -58, 18, 48, 720, 1100, 0);
      burst(W - 26, H + 6, -122, 18, 48, 720, 1100, .12);
      burst(W / 2, H - 70, -90, 28, 54, 600, 900, .3);
      if (!FIN.raf) { FIN.last = performance.now(); FIN.raf = requestAnimationFrame(tick); }
      ORDER.forEach(cheer);
    };

    /* герои: прибегают справа, встают рядком внизу, радуются салюту — каждый по-своему */
    function heroSVG(t) {
      var face = t === 'I' ? '#0C0F18' : '#FFFFFF';
      return '<div class="hb"><svg class="hs" viewBox="0 0 24 38" width="40" height="63" aria-hidden="true" focusable="false">' +
        '<g stroke="#0C0F18" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none">' +
        '<g class="lg a"><polyline points="8 22 8 35 11.5 35"/></g><g class="lg b"><polyline points="16 22 16 35 19.5 35"/></g></g>' +
        '<circle cx="12" cy="12" r="12" fill="' + HCOL[t] + '"/>' +
        '<g class="face" fill="' + face + '"><circle cx="7.2" cy="11" r="1.15"/><circle cx="16.8" cy="11" r="1.15"/><path d="M 9.5 14 H 14.5 A 2.5 2.5 0 0 1 9.5 14"/></g></svg></div>';
    }
    function cheer(t) {
      var e = FIN.heroes[t]; if (!e || !e.here) return;
      e.el.classList.remove('cheer'); void e.el.offsetWidth; e.el.classList.add('cheer');
      e.el.querySelector('.hb').onanimationend = function () { e.el.classList.remove('cheer'); };
    }
    function move(h, from, to, ms, easing, g, done) {
      h.el.classList.remove('idle'); h.el.classList.add('run', 'left');
      var a = h.el.animate([{ transform: 'translateX(' + from + 'px)' }, { transform: 'translateX(' + to + 'px)' }], { duration: ms, easing: easing, fill: 'forwards' });
      a.onfinish = function () { if (g !== FIN.gen) return; h.el.style.transform = 'translateX(' + to + 'px)'; a.cancel(); h.el.classList.remove('run', 'left'); if (done) done(); };
    }
    function arrive(t) { var h = FIN.heroes[t]; h.here = true; h.el.classList.add('idle'); cheer(t); }

    function start() {
      var fr = root.getBoundingClientRect(), st = root.parentNode.getBoundingClientRect(), g = ++FIN.gen;
      FIN.W = fr.width; FIN.H = fr.height;
      var layer = document.createElement('div'); layer.className = 'fin-layer';
      layer.style.left = (fr.left - st.left) + 'px'; layer.style.top = (fr.top - st.top) + 'px'; layer.style.width = fr.width + 'px'; layer.style.height = fr.height + 'px';
      var dpr = Math.min(window.devicePixelRatio || 1, 2), cv = document.createElement('canvas'); cv.className = 'fin-cv'; cv.setAttribute('aria-hidden', 'true');
      cv.width = fr.width * dpr; cv.height = fr.height * dpr; var ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
      layer.appendChild(cv); root.parentNode.appendChild(layer);
      FIN.layer = layer; FIN.cv = cv; FIN.ctx = ctx; FIN.parts = []; FIN.heroes = {};
      var floor = fr.height - 40, gap = 58, cx = fr.width / 2, W = fr.width, far = W + 80;
      ORDER.forEach(function (t, i) {
        var el = document.createElement('div'); el.className = 'hero h' + t; el.innerHTML = heroSVG(t);
        el.style.top = (floor - 63 + 1) + 'px';
        var x = cx + (i - 1.5) * gap - 20;
        FIN.heroes[t] = { el: el, x: x, here: false };
        el.style.transform = 'translateX(' + (REDUCED.matches ? x : far) + 'px)';
        layer.appendChild(el);
        if (REDUCED.matches) { FIN.heroes[t].here = true; el.classList.add('idle'); }
      });
      if (REDUCED.matches) { at(finVolley, 300, g); return; }
      var H_ = FIN.heroes;
      at(function () { move(H_.D, far, H_.D.x, 1700, 'cubic-bezier(.25,.8,.35,1)', g, function () { arrive('D'); }); }, 100, g);
      at(function () { move(H_.I, far, H_.I.x, 2500, 'cubic-bezier(.3,.6,.35,1)', g, function () { arrive('I'); }); }, 500, g);
      at(function () { move(H_.S, far, H_.S.x, 3400, 'cubic-bezier(.35,.15,.4,1)', g, function () { arrive('S'); }); }, 1000, g);
      at(function () {
        var mid = H_.C.x + 230;
        move(H_.C, far, mid, 1500, 'cubic-bezier(.4,.1,.5,1)', g, function () {
          H_.C.el.classList.add('look');
          at(function () { H_.C.el.classList.remove('look'); move(H_.C, mid, H_.C.x, 1300, 'cubic-bezier(.4,.1,.5,1)', g, function () { arrive('C'); }); }, 1000, g);
        });
      }, 1500, g);
      at(finVolley, 1900, g); // залп, когда D уже прибежал, а остальные ещё в пути: каждый радуется, когда добегает
    }
    function stop() {
      FIN.gen++; FIN.timers.forEach(clearTimeout); FIN.timers = [];
      if (FIN.raf) cancelAnimationFrame(FIN.raf); FIN.raf = 0;
      if (FIN.layer) FIN.layer.remove(); FIN.layer = null; FIN.parts = []; FIN.heroes = {};
    }
    finSync = function () {
      if (S.ui.screen === 'finish') { if (!FIN.layer) start(); }
      else if (FIN.layer) stop();
    };
  })();

  var VAL = null;

  /* ═════════ СТАРТ ═════════ */
  document.body.classList.add('m-' + CFG.mode);
  storage.load();
  VAL = validateContent();
  if (VAL.errs.length) console.error('[DISC] Ошибки контента:', VAL.errs);
  if (VAL.warns.length) console.warn('[DISC] Предупреждения контента:', VAL.warns);
  (function restoreScreen() {
    var u = S.ui, sc = u.screen;
    if (sc === 'about' && u.aboutStep) SES.aboutOpen = u.aboutStep; // обновление страницы: тот же шаг, что был на экране
    if (CFG.mode === 'theory') {
      if (['home', 'about', 'type', 'compare'].indexOf(sc) < 0) u.screen = 'home';
      var sec = secOfScreen(); if (sec && !secOpen(sec)) u.screen = 'home';
      if (u.screen === 'type') markTab(u.type, u.tab);
      if (u.screen !== 'type' || !u.returnTo) { if (u.screen !== 'type') u.returnTo = null; }
    } else {
      if (store.complete && !S.scormCompleted) { try { store.complete(); } catch (e) { } S.scormCompleted = true; } // СОСТ-8.6
      if (['trainer-round'].concat(ROUND_SCREENS).indexOf(sc) >= 0) u.screen = 'trainer-formats'; // СОСТ-6.1
      if (sc === 'quiz-question' && !S.quiz.inProgress) u.screen = quizDone() ? 'quiz-result' : 'quiz-intro';
      if (sc === 'quiz-result' && !quizDone()) u.screen = 'quiz-intro';
      if (sc === 'pair-select') { var rt = u.returnTo; SES.pair = { self: quizDone() ? S.quiz.leader : null, other: null }; u.returnTo = rt; }
      if (sc === 'tour' && !S.firstOpen) u.screen = 'home'; // Чистка: экскурсия не восстанавливается после завершения
      if (S.firstOpen) { u.screen = 'tour'; SES.tourStep = 0; } // ПП-2.1, МЕХ-2.9
    }
  })();
  SECTIONS.forEach(function (s) { FX.prevDone[s] = secDone(s); });
  TYPES.forEach(function (t) { if (secDone(t)) FX.homeShown[t] = true; S.progress.tabs[t].forEach(function (n) { FX.okSeen['tab' + t + n] = true; }); });
  S.progress.aspects.forEach(function (n) { FX.okSeen['asp' + n] = true; });
  FX.prevAll = FX.homeFinale = allDone();
  FX.aboutEnter = S.ui.screen === 'about';
  storage.save();
  render();
})();

</script>
