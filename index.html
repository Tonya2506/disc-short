/* ═══════════════════════════════════════════════════════════════
   DISC · справочник (theory) · дизайн «как в Notion»
   База — design.md курса «Понятно друг другу»: палитра, Manrope, кнопки.
   Цвета типов D / I / S / C и их роли сохранены без изменений.
   Холст 960 × 540: 1 px здесь = 1 px холста.
   ═══════════════════════════════════════════════════════════════ */

:root{
  /* палитра курса (design.md, раздел 12) */
  --c-white:#FFFFFF; --c-paper:#F9FBFD; --c-ink:#0C0F18; --c-red:#EF0000;
  --c-gray-300:#B5B8BC; --c-gray-500:#93969B; --c-gray-700:#505259; --c-gray-800:#2E3139;
  --c-mint:#B3DBC0; --c-teal:#67BACA; --c-blue:#467599;
  --g-accent:linear-gradient(180deg,#B3DBC0 0%,#67BACA 100%);
  --c-mint-20:rgba(179,219,192,.2); --c-mint-44:rgba(179,219,192,.44); --c-mint-soft:#F4FAF6;
  --c-teal-20:rgba(103,186,202,.2); --c-red-20:rgba(239,0,0,.2);
  --n-line:#D5D8DC; --n-line-soft:#DEE2E6; --n-control:#C8CCD0; --n-track:#E2E5E8; --n-bar:#EDEFF1;
  --n-surface:rgba(222,226,230,.29); --overlay:rgba(12,15,24,.54);
  --glow:0 5px 8.4px rgba(103,186,202,.4);
  --font:"Manrope","Segoe UI",system-ui,-apple-system,Arial,sans-serif;

  /* цвета типов — без изменений */
  --D:#C8372D; --I:#A87A00; --S:#23845A; --C:#2A60C6;
  --Df:#E0574C; --If:#F0B82E; --Sf:#3DAA78; --Cf:#4B7FE0;
  --Dt:#FBEAE8; --It:#FCF3DA; --St:#E2F2EA; --Ct:#E5ECFA;

  /* «как в Notion»: мягкий ховер, тени меню, отступы */
  --hover:rgba(12,15,24,.05); --press:rgba(12,15,24,.08);
  --sh-menu:0 1px 2px rgba(12,15,24,.04),0 12px 32px -6px rgba(12,15,24,.16);
  --sh-lift:0 1px 2px rgba(12,15,24,.04),0 4px 12px rgba(12,15,24,.06);

  /* кегли design.md, px @960 */
  --fs-title:32px; --fs-h3:24px; --fs-h4:21.333px; --fs-h5:18.667px; --fs-lead:18.667px;
  --fs-text:16px; --fs-small:13.333px; --fs-caption:10.667px; --fs-overline:10.667px;
  --lh-tight:1.37; --lh-text:1.57;

  /* радиусы design.md */
  --r-xs:2px; --r-s:4px; --r-btn:7px; --r-m:10px; --r-step:12px; --r-modal:15px; --r-l:20px; --r-pill:999px;

  /* старые имена — для экранов full, которые живут в общем коде */
  --ink:var(--c-ink); --muted:var(--c-gray-700); --line:var(--n-line-soft); --paper:var(--c-white);
  --canvas:var(--n-bar); --soft:#F1F3F5; --focus:var(--c-ink);
  --r-sm:var(--r-btn); --r-md:var(--r-m); --r-lg:var(--r-step);

  font-family:var(--font); color:var(--c-ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--n-bar)}
body{font-size:var(--fs-text);line-height:var(--lh-text)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--c-ink);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;line-height:var(--lh-tight)}
p{margin:0 0 8px}
b{font-weight:700}

/* ── кадр ── */
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{background:var(--c-paper);position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--n-line-soft),0 8px 30px rgba(12,15,24,.06)}
.m-theory .frame{width:960px;height:540px;flex:none}
/* Правило: красная линия снизу — на ВСЕХ экранах (та же толщина и положение, что на финальном экране); поверх содержимого, клики не перехватывает */
.frame::after{content:"";position:absolute;left:0;right:0;bottom:.5px;height:2.5px;background:var(--c-red);pointer-events:none;z-index:2}
.m-theory .stage{padding:0}
.m-full .stage{align-items:stretch;padding:10px 16px}
.m-full .frame{width:100%;max-width:1200px;height:100%;min-height:600px}

/* ── оболочка ── */
.app{display:flex;flex-direction:column;height:100%}

/* шапка: как верхняя строка страницы в Notion — тихая, без рамок у кнопок */
.hd{display:flex;align-items:center;gap:4px;height:46px;padding:0 24px;border-bottom:1px solid var(--n-line-soft);flex:none;font-size:var(--fs-small)}
.hd .brand{font-weight:700;white-space:nowrap;padding:0 8px 0 2px;letter-spacing:-.01em}
.hd .brand i{font-style:normal;color:var(--c-gray-700);font-weight:400}
.hd .spacer{flex:1}
.btn-ghost{background:none;border:0;border-radius:6px;padding:5px 9px;font-size:var(--fs-small);line-height:1.37;color:var(--c-ink);transition:background-color .12s}
.btn-ghost:hover{background:var(--hover)}
.btn-ghost:active{background:var(--press)}
.btn-ghost[aria-expanded="true"]{background:var(--hover)}
.btn-ghost.ic{display:inline-flex;align-items:center;justify-content:center;padding:6px 8px}
.btn-ghost.ic svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.btn-ghost.here,.btn-ghost.here:hover{background:var(--c-teal-20);-webkit-text-stroke:.35px currentColor;cursor:default}
.help{width:28px;height:28px;border-radius:6px;border:0;background:none;font-weight:700;font-size:var(--fs-small)}
.help:hover{background:var(--hover)}
.help.spot{background:var(--c-teal-20);box-shadow:0 0 0 2px var(--c-teal)}

/* шаги маршрута: строка «хлебных крошек» */
.steps{display:flex;gap:2px;flex:1;justify-content:center;align-items:center}
.chip{display:flex;align-items:center;gap:6px;border:0;background:none;border-radius:6px;padding:4px 9px 4px 4px;font-size:var(--fs-small);line-height:1.37;white-space:nowrap;color:var(--c-ink);transition:background-color .12s}
.chip:not(:disabled):hover{background:var(--hover)}
.chip .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--n-control);font-size:var(--fs-caption);font-weight:700;color:var(--c-gray-700);flex:none}
.chip.done .n{background:var(--c-mint);box-shadow:none;color:var(--c-ink)}
.chip.lock{color:var(--c-gray-300)}
.chip.lock .n{color:var(--c-gray-300);box-shadow:inset 0 0 0 1px var(--c-gray-300)}
.chip.here,.chip.here:hover{background:var(--c-teal-20);-webkit-text-stroke:.35px currentColor}
.chip.here .n{box-shadow:inset 0 0 0 1px var(--c-ink);color:var(--c-ink)}
.chip.here.done .n{box-shadow:none}

/* выпадающее меню разделов */
.menu-wrap{position:relative}
.menu{position:absolute;top:34px;left:0;background:var(--c-white);border:1px solid var(--n-line-soft);border-radius:var(--r-m);box-shadow:var(--sh-menu);padding:5px;min-width:290px;z-index:20}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;font-size:var(--fs-small);line-height:1.37}
.menu button:hover{background:var(--hover)}
.menu .mk{color:var(--c-gray-700);font-size:12px;white-space:nowrap}
.menu hr{border:0;border-top:1px solid var(--n-line-soft);margin:5px 4px}

.main{flex:1;overflow:auto;padding:22px 38px;position:relative}

.main[data-screen="home"] .home{position:relative;z-index:1}

/* ── кнопки курса (design.md, раздел 6) ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:35px;padding:0 32px;border:0;border-radius:var(--r-btn);
  background:var(--g-accent);color:var(--c-ink);font-size:var(--fs-small);font-weight:400;line-height:1.37;text-transform:uppercase;white-space:nowrap;transition:box-shadow .15s}
.btn:hover:not(:disabled){box-shadow:var(--glow)}
.btn.sec{background:var(--c-paper);box-shadow:inset 0 0 0 1px var(--c-ink)}
.btn.sec:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--c-ink),var(--glow)}
.btn:disabled,.btn.sec:disabled{background:var(--c-paper);box-shadow:inset 0 0 0 1px var(--c-gray-300);color:var(--c-gray-300)}
.btn.lg{height:35px;padding:0 32px;font-size:var(--fs-small)}
.btn.sm,.tabrow .card-actions .btn{height:31px;padding:0 16px;font-size:var(--fs-caption);border-radius:6.2px}

.link{background:none;border:0;padding:0;color:var(--c-ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--c-gray-300);text-decoration-thickness:1px;text-underline-offset:3px}
.link:hover{text-decoration-color:var(--c-ink)}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;border-radius:6px;margin:0 0 6px -6px;padding:2px 6px;color:var(--c-gray-700);font-size:var(--fs-small);line-height:1.37}
.back:hover{background:var(--hover);color:var(--c-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--c-gray-700)}
.small{font-size:var(--fs-small)}
/* метка временного текста прототипа: пунктир как у заглушек курса */
.temp{display:inline-block;font-size:var(--fs-caption);line-height:1.5;color:var(--c-gray-700);border:1px dashed var(--n-line);border-radius:var(--r-s);padding:0 6px;margin-left:6px;vertical-align:middle;font-weight:600}

/* отметка «просмотрено»: мятный кружок с галочкой, как пройденная миссия в курсе */
.ok{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--c-mint);color:var(--c-ink);font-size:9px;font-weight:800;line-height:1;margin-left:2px;vertical-align:1px;-webkit-text-stroke:0}
.ok.off{background:none;box-shadow:inset 0 0 0 1px var(--n-control)}

/* ── квадрант (общий для главной и «О модели») ── */
.quad{--qs:336px;display:grid;grid-template-columns:auto var(--qs) auto;grid-template-rows:auto var(--qs) auto;gap:6px;align-items:center;justify-items:center;user-select:none}
.quad .ax{font-size:var(--fs-small);font-weight:700;color:var(--c-ink);padding:1px 6px;cursor:default;line-height:1.37}
.quad .ax.lft,.quad .ax.rgt{writing-mode:vertical-rl;transform:rotate(180deg);padding:6px 1px}
.quad .ax.rgt{transform:none}
.qlg{margin-top:10px;display:grid;gap:3px;font-size:12px;line-height:1.4;color:var(--c-gray-700);max-width:360px}
.qlg div{display:grid;grid-template-columns:18px 1fr;gap:6px}
.qlg b{color:var(--c-ink);font-weight:700;text-align:center}
.grid4{position:relative;width:var(--qs);height:var(--qs);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:4px}
.grid4::before,.grid4::after{content:"";position:absolute;background:var(--c-ink);opacity:.14;pointer-events:none}
.grid4::before{left:50%;top:-6px;bottom:-6px;width:1px}
.grid4::after{top:50%;left:-6px;right:-6px;height:1px}
.sq{position:relative;border:0;border-radius:var(--r-m);padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;min-width:0;min-height:0;overflow:hidden;transition:filter .15s,opacity .2s,box-shadow .2s}
.sq > span{display:flex;flex-direction:column;min-width:0}
.sq .L{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.02em}
.sq .nm{font-size:12px;font-weight:700;line-height:1.37}
.sq .mk{font-size:12px;line-height:1.35;margin-top:2px}
.sq .st{font-size:11px;font-weight:700;margin-top:4px;white-space:nowrap}
.sq.D{background:var(--Dt);color:var(--D)} .sq.I{background:var(--It);color:var(--I)} .sq.S{background:var(--St);color:var(--S)} .sq.C{background:var(--Ct);color:var(--C)}
.sq.D{border-top-left-radius:40px}.sq.I{border-top-right-radius:40px}.sq.C{border-bottom-left-radius:40px}.sq.S{border-bottom-right-radius:40px}
.sq.I,.sq.S{text-align:right;align-items:flex-end}
.sq.I > span,.sq.S > span{align-items:flex-end}
.sq:not(:disabled):hover{filter:brightness(.97);box-shadow:inset 0 0 0 1px currentColor}
.sq:disabled{opacity:.45;cursor:default}
.sq.you{box-shadow:inset 0 0 0 3px currentColor}
.sq .you-tag{position:absolute;top:8px;right:8px;background:currentColor;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
.sq .you-tag span{color:#fff}
.sq.I .you-tag,.sq.S .you-tag{right:auto;left:8px}

/* ── главная ── */
.home{display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:center;padding-top:2px} /* Правка «Визуал главной»: схема и текст отцентрованы друг относительно друга */
.home h1,.pagetitle{font-size:var(--fs-title);font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-bottom:10px}
.home p.muted{font-size:var(--fs-text);line-height:var(--lh-text);margin-bottom:14px;max-width:34ch}
.counter{display:flex;align-items:center;gap:8px;font-size:var(--fs-small);color:var(--c-gray-700);margin-bottom:18px}
/* после прохождения: строки разделов, как строки базы данных */
.entries{display:grid;gap:0;margin:4px 0 16px;border-top:1px solid var(--n-line-soft)}
.entry{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--n-line-soft);border-radius:0;padding:11px 8px;transition:background-color .12s}
.entry:hover{background:var(--hover)}
.entry b{display:block;font-size:var(--fs-text);font-weight:700}
.entry span{font-size:var(--fs-small);color:var(--c-gray-700)}
.entry .mk{font-size:12px;color:var(--c-gray-700)}
.closecap{border:1px dashed var(--n-line);border-radius:var(--r-m);padding:10px 14px;color:var(--c-gray-700);font-size:var(--fs-small);display:inline-block}

/* ── О модели ── */

.ab h1{font-size:var(--fs-small);font-weight:700;color:var(--c-gray-700);margin:0 0 6px;letter-spacing:0}
.ab-prog{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:10px;max-width:460px}
.ab-prog button{height:14px;border:0;background:none;padding:0;position:relative;cursor:pointer}
.ab-prog button::before{content:"";position:absolute;left:0;right:0;top:5px;height:4px;border-radius:var(--r-pill);background:var(--c-gray-300);transition:background-color .2s}
.ab-prog button:hover:not(:disabled)::before{background:var(--c-gray-500)}
.ab-prog button.on::before{background:var(--c-teal)}
.ab-prog button:disabled{cursor:default}.ab-prog button:disabled::before{background:var(--n-track)}
.ab-kick{font-size:var(--fs-overline);letter-spacing:.25em;text-transform:uppercase;color:var(--c-gray-700);margin:0 0 8px;font-variant-numeric:tabular-nums;line-height:1.37}
.ab-kick b{color:var(--c-ink);font-weight:800}
.ab-big{font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
.ab-txt p{font-size:14.5px;line-height:1.5;margin:0 0 8px;max-width:62ch} /* Правка «О модели»: текст шагов 14,5 px вместо 15 — чтобы поднять кнопки */
.ab-txt .ref{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--c-ink)}
.ab-txt .uD{text-decoration-color:var(--D)}.ab-txt .uI{text-decoration-color:var(--I)}.ab-txt .uS{text-decoration-color:var(--S)}.ab-txt .uC{text-decoration-color:var(--C)}
.ab-txt .tD{color:var(--D);font-weight:700}.ab-txt .tI{color:var(--I);font-weight:700}.ab-txt .tS{color:var(--S);font-weight:700}.ab-txt .tC{color:var(--C);font-weight:700}
.ab-body.in{animation:abTx .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes abTx{from{opacity:0;transform:translateY(8px)}}
.ab-nav{margin-top:auto;padding-top:10px;display:flex;gap:15px;align-items:center}
/* сцена: координаты от центра квадранта (x 212, y 175) */
.ab-stage{position:relative;width:424px;height:420px;align-self:start}
.ab-stage .ab-m{transition:left .7s cubic-bezier(.2,.7,.2,1),top .7s cubic-bezier(.2,.7,.2,1),font-size .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1),opacity .5s}
.ab-yr{position:absolute;left:50%;top:58px;width:250px;margin-left:-146px} /* карточка вместе со штампом отцентрирована по тексту шага (от надзаголовка до конца текста) и по ширине области */ /* Правка «Портрет»: шаг 01 — карточка из архива: портрет, имя, год штампом */
.ab-card{background:var(--c-white);border-radius:6px;padding:14px 14px 18px;position:relative;box-shadow:0 1px 2px rgba(12,15,24,.05),0 10px 28px -8px rgba(12,15,24,.22);transform:rotate(-2deg);transform-origin:50% 50%} /* пульсация от центра карточки */
.ab-card-ph{background:var(--c-paper);border:1px solid var(--n-line);border-radius:3px;padding:14px 22px 0}
.ab-card-ph img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.ab-card-nm{text-align:center;margin-top:14px;font-size:var(--fs-text);font-weight:700;color:var(--c-ink)}
.ab-card-rule{height:1px;background:var(--n-line);margin:10px 20px 0}
.ab-stamp{position:absolute;right:-26px;bottom:-22px;border:3px solid var(--c-mint);background:var(--c-mint-soft);color:var(--c-mint);border-radius:10px;padding:6px 10px 5px;transform:rotate(-12deg);font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
/* Правка «Портрет»: анимация мягче — карточка плавно приходит сверху без раскачивания, затем аккуратная пульсация; штамп появляется без рывка */
.ab-card.play{animation:abCardIn .9s cubic-bezier(.22,.8,.3,1) both,abCardPulse 1.4s ease-in-out 1.05s forwards}
.ab-card.play .ab-stamp{animation:abStamp .5s cubic-bezier(.22,.8,.3,1) .95s both}
.ab-card.play .odo.play .odo-s{animation-delay:calc(1s + var(--k) * .06s)}
@keyframes abCardIn{from{opacity:0;transform:translateY(-48px) rotate(-2deg)}to{opacity:1;transform:translateY(0) rotate(-2deg)}}
@keyframes abCardPulse{0%,100%{transform:rotate(-2deg) scale(1)}25%{transform:rotate(-2deg) scale(1.018)}50%{transform:rotate(-2deg) scale(1)}75%{transform:rotate(-2deg) scale(1.01)}}
@keyframes abStamp{from{opacity:0;transform:rotate(-12deg) scale(1.25)}to{opacity:1;transform:rotate(-12deg) scale(1)}}
.ab-ln{position:absolute;background:var(--c-ink);opacity:.9}
.ab-ln.v{left:212px;top:19px;width:1px;height:312px;transform:scaleY(0);transform-origin:50% 100%}
.ab-ln.h{left:56px;top:175px;width:312px;height:1px;transform:scaleX(0);transform-origin:0 50%}
.ab-w{position:absolute;left:212px;top:175px;font-size:40px;transform:translate(-50%,-50%);white-space:nowrap;font-weight:800;letter-spacing:-.02em;line-height:1.05;background:var(--c-paper);padding:2px 8px;opacity:0;z-index:1}
.ab-q{position:absolute;left:50%;top:0;transform:translateX(-50%);opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
.ab-stage:not([data-s="0"]) .ab-yr{opacity:0;transform:translateY(-30px)}
.ab-stage[data-s="1"] .ab-ln.v{transform:scaleY(1)}
.ab-stage[data-s="1"] .ab-w.T{top:87px;font-size:42px;opacity:1}.ab-stage[data-s="1"] .ab-w.B{top:263px;font-size:42px;opacity:1}
.ab-stage[data-s="2"] .ab-ln.v{transform:scaleY(1);opacity:.18}.ab-stage[data-s="2"] .ab-ln.h{transform:scaleX(1)}
.ab-stage[data-s="2"] .ab-w.T{top:10px;font-size:13px;padding:0 4px;opacity:.55}.ab-stage[data-s="2"] .ab-w.B{top:340px;font-size:13px;padding:0 4px;opacity:.55}
.ab-w.L,.ab-w.R{width:max-content;max-width:172px;white-space:normal;text-align:center}
.ab-stage[data-s="2"] .ab-w.L{left:98px;font-size:26px;opacity:1}.ab-stage[data-s="2"] .ab-w.R{left:326px;font-size:26px;opacity:1}
.ab-stage[data-s="3"] .ab-ln,.ab-stage[data-s="4"] .ab-ln{opacity:0}
.ab-stage[data-s="3"] .ab-w,.ab-stage[data-s="4"] .ab-w{font-size:13px;padding:0 4px;opacity:0}
.ab-stage[data-s="3"] .ab-w.T,.ab-stage[data-s="4"] .ab-w.T{top:10px}.ab-stage[data-s="3"] .ab-w.B,.ab-stage[data-s="4"] .ab-w.B{top:340px}
.ab-stage[data-s="3"] .ab-w.L,.ab-stage[data-s="4"] .ab-w.L{left:46px;transform:translate(-50%,-50%) rotate(-90deg)}
.ab-stage[data-s="3"] .ab-w.R,.ab-stage[data-s="4"] .ab-w.R{left:378px;transform:translate(-50%,-50%) rotate(90deg)}
.ab-stage[data-s="3"] .ab-q,.ab-stage[data-s="4"] .ab-q{opacity:1;visibility:visible;transition:opacity .4s,visibility 0s}
.ab-stage[data-s="3"] .sq{animation:abSq .5s cubic-bezier(.2,.7,.2,1) both}
.ab-stage[data-s="3"] .sq:nth-child(2){animation-delay:.09s}.ab-stage[data-s="3"] .sq:nth-child(3){animation-delay:.18s}.ab-stage[data-s="3"] .sq:nth-child(4){animation-delay:.27s}
@keyframes abSq{from{opacity:0;transform:scale(.94)}}
/* шаг 5: границы размываются, стили остаются */
.quad .sq{z-index:1}
.q-blur{position:absolute;inset:0;border-radius:40px;overflow:hidden;z-index:0;opacity:0;pointer-events:none;transition:opacity 1s cubic-bezier(.2,.7,.2,1)}
.q-blur i{position:absolute;width:180px;height:180px;border-radius:50%;filter:blur(22px)}
.q-blur .D{left:-16px;top:-16px;background:var(--Dt)}.q-blur .I{right:-16px;top:-16px;background:var(--It)}
.q-blur .C{left:-16px;bottom:-16px;background:var(--Ct)}.q-blur .S{right:-16px;bottom:-16px;background:var(--St)}
.ab-stage .sq{transition:background-color 1s cubic-bezier(.2,.7,.2,1)}
.ab-stage .sq:hover{filter:none;box-shadow:none}
.ab-stage .grid4::before,.ab-stage .grid4::after{transition:opacity 1s cubic-bezier(.2,.7,.2,1)}
.ab-stage[data-s="4"] .q-blur{opacity:1}
.ab-stage[data-s="4"] .sq{background-color:transparent}
.ab-stage[data-s="4"] .grid4::before,.ab-stage[data-s="4"] .grid4::after{opacity:0}
@media (prefers-reduced-motion:reduce){.ab-stage *,.ab-stage .grid4::before,.ab-stage .grid4::after,.ab-body{transition:none!important;animation:none!important}}

/* ── карточка типа: страница с иконкой ── */
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:8px}
.card-hd{display:flex;align-items:center;gap:14px}
.card-hd .back{display:flex;width:max-content}
.card-hd .bigL{width:44px;height:44px;border-radius:var(--r-m);display:grid;place-items:center;font-size:26px;font-weight:800;color:#fff;flex:none;letter-spacing:-.02em}
.card-hd h1{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.card-hd .tl{font-size:15px;color:var(--c-gray-700);line-height:1.4;margin-top:1px}
.bg-D{background:var(--Df)}.bg-I{background:var(--If)}.bg-S{background:var(--Sf)}.bg-C{background:var(--Cf)}
.tx-D{color:var(--D)}.tx-I{color:var(--I)}.tx-S{color:var(--S)}.tx-C{color:var(--C)}
/* вкладки: подчёркивание, как сегменты в Notion; выбранная — бирюзовая полоса курса */
.tabrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px} /* Правка «Карточки»: линия во всю ширину убрана */
.tabs{position:relative;display:flex;gap:2px}
.tabrow .tabs{border-bottom:1px solid var(--n-line-soft);margin-bottom:0} /* Правка «Карточки»: линия только под меню вкладок */
.tabs button{position:relative;background:none;border:0;padding:5px 10px 8px;font-size:15px;line-height:1.37;color:var(--c-gray-700);display:flex;gap:6px;align-items:center;border-radius:6px 6px 0 0}
.tabs button:hover{color:var(--c-ink);background:var(--hover)}
.tabs button.on{color:var(--c-ink);-webkit-text-stroke:.35px currentColor}
.tabs button.on:hover{background:none}
.tabrow .card-actions{display:flex;gap:8px;margin:0;padding:0 0 7px;border:0;flex-wrap:nowrap}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--n-line-soft)}
.switcher{display:flex;gap:4px;align-items:center}
.switcher button{width:32px;height:32px;border-radius:var(--r-btn);border:0;background:none;font-weight:800;font-size:var(--fs-small);color:var(--c-gray-700);transition:background-color .12s}
.switcher button:hover{background:var(--hover);color:var(--c-ink)}
.switcher button.on{color:#fff}
.switcher button.bg-D{background:var(--Df)}.switcher button.bg-I{background:var(--If)}.switcher button.bg-S{background:var(--Sf)}.switcher button.bg-C{background:var(--Cf)}

/* текст вкладок */
.tabbody{max-width:72ch}
.tabbody h3{font-size:15px;font-weight:800;color:var(--c-ink);letter-spacing:-.01em;margin:0 0 8px;line-height:1.37}
.tabbody p{margin:0 0 8px}
.tabbody ul{margin:0 0 6px;padding:0;list-style:none}
.tabbody li{position:relative;padding-left:18px;margin-bottom:4px}
.tabbody li::before{content:"";position:absolute;left:5px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--c-ink)}
.m-theory .tabbody,.m-full .tabbody{max-width:none}
.m-theory .tabbody.t1,.m-theory .tabbody.t2,.m-full .tabbody.t1,.m-full .tabbody.t2{display:grid;grid-template-columns:.88fr 1.12fr;gap:32px;align-items:stretch; /* Правка «Карточки»: колонки равной высоты — вертикальная линия идёт на всю высоту текста, как во вкладке «Кто это» */font-size:14.5px;line-height:1.5}
.m-theory .tabbody.t1 .tcol + .tcol,.m-theory .tabbody.t2 .tcol + .tcol{border-left:1px solid var(--n-line-soft);padding-left:26px;margin-left:-6px}
.m-theory .tabbody.t3 > h3,.m-full .tabbody.t3 > h3{display:none}

/* правила «Как говорить»: карточки-реплики курса */
.rule{background:var(--c-white);border:1px solid var(--n-line-soft);border-radius:var(--r-m);padding:11px 12px;margin-bottom:8px}
.rule .rt{font-weight:700;margin-bottom:7px;font-size:var(--fs-small);line-height:1.4}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.yn>div{position:relative;border-radius:var(--r-s);padding:5px 9px 5px 12px;font-size:12.5px;line-height:1.42}
.yn>div::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:var(--r-s) 0 0 var(--r-s)}
.yn .y{background:var(--c-mint-44)} .yn .y::before{background:var(--c-teal)}
.yn .n{background:var(--n-surface);color:var(--c-gray-700)} .yn .n::before{background:var(--n-control)}
.yn b{display:block;font-size:var(--fs-caption);text-transform:uppercase;letter-spacing:.2em;margin-bottom:2px;font-weight:800}
.yn .y b{color:var(--c-ink)} .yn .n b{color:var(--c-gray-700)}
.yn.one{grid-template-columns:1fr}
.m-theory .rules,.m-full .rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:8px}
.m-theory .rules .rule,.m-full .rules .rule{margin:0}
.m-theory .rules .yn,.m-full .rules .yn{grid-template-columns:1fr;gap:5px}
.m-theory .rules .yn b,.m-full .rules .yn b{display:inline;margin-right:6px}
.m-theory .rules.paged{display:flex;justify-content:center;gap:10px}
.m-theory .rules.paged .rule{flex:0 0 calc((100% - 20px) / 3)}
.m-theory .rules .rule{min-height:var(--rule-h,0)}
.m-theory .rules.measure{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;align-items:flex-start;justify-content:flex-start}
.m-theory .rules.measure .rule{min-height:0}
/* примечание: бирюзовая панель «ВАЖНО» курса, как callout в Notion */
.note{background:var(--c-teal-20);border-radius:var(--r-m);padding:8px 14px;font-size:var(--fs-small);line-height:1.45}

/* пейджер */
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
.pg-arr{width:31px;height:31px;border-radius:6.2px;border:0;background:var(--c-paper);box-shadow:inset 0 0 0 1px var(--c-ink);font-size:18px;line-height:1;color:var(--c-ink);display:grid;place-items:center;padding:0 0 2px;transition:box-shadow .15s}
.pg-arr:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--c-ink),var(--glow)}
.pg-arr:disabled{color:var(--c-gray-300);box-shadow:inset 0 0 0 1px var(--c-gray-300);cursor:default}
.pg-arr.hot{background:var(--g-accent);box-shadow:none}
.pg-arr.hot:hover{box-shadow:var(--glow)}
.pg-mid{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:130px}
.pg-dots{display:flex;gap:8px}
.pager .dot{width:9px;height:9px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px var(--n-control);background:var(--c-white);padding:0}
.pager .dot.seen{background:var(--c-gray-300);box-shadow:none}
.pager .dot.on{background:var(--c-teal);box-shadow:none;width:22px;border-radius:var(--r-pill)}
.pager .pgn{font-size:12px;color:var(--c-gray-700)}

/* ── сравнение ── */
.compare h1{font-size:var(--fs-h3);font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.col{border-radius:var(--r-step);padding:14px;text-align:left;border:0;min-height:var(--col-h,150px);display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
.col .L{font-size:28px;font-weight:800;line-height:1;letter-spacing:-.02em}
.col .v{color:var(--c-ink);font-size:15px;line-height:1.45}
.col.D{background:var(--Dt);color:var(--D)}.col.I{background:var(--It);color:var(--I)}.col.S{background:var(--St);color:var(--S)}.col.C{background:var(--Ct);color:var(--C)}
.col:hover{box-shadow:inset 0 0 0 1px currentColor}
.col .go{margin-top:auto;font-size:12px;color:var(--c-gray-700)}
.col:hover .go{color:var(--c-ink)}
.cnote{font-size:var(--fs-small);line-height:1.55;color:var(--c-gray-700);margin:14px 0 0;max-width:86ch}

/* ── оверлеи ── */
.ov{position:absolute;inset:0;background:var(--overlay);display:grid;place-items:center;z-index:30;padding:20px}
.dlg{background:var(--c-paper);border-radius:var(--r-modal);padding:22px;max-width:446px;width:100%;max-height:100%;overflow:auto;box-shadow:var(--sh-menu)}
.dlg h2{font-size:var(--fs-h5);font-weight:700;margin-bottom:10px}
.dlg p{font-size:var(--fs-small)}
.dlg .acts{display:flex;justify-content:flex-end;gap:15px;margin-top:18px}
.dlg.faq{max-width:860px}
.faq h3{font-size:var(--fs-small);font-weight:700;margin:12px 0 3px}
.faq p{font-size:var(--fs-small);color:var(--c-gray-700)}
.faqgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px}
.faqgrid h3{margin-top:8px}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--c-white);color:var(--c-ink);border:1px solid var(--n-line-soft);box-shadow:var(--sh-menu);padding:10px 14px;border-radius:var(--r-m);font-size:var(--fs-small);z-index:40;max-width:80%}
.slide{text-align:center}
.slide code{background:var(--n-surface);padding:1px 5px;border-radius:var(--r-s)}

/* ═════ экраны full (общий код; в этом файле не показываются) ═════ */
.fhome{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:start}
.m-full .entries{grid-template-columns:1fr 1fr;gap:8px;border:0;margin:10px 0 0}
.m-full .entry{background:var(--c-white);border:1px solid var(--n-line-soft);border-radius:var(--r-m);padding:10px 14px}
.entry.wb{grid-template-columns:auto 1fr auto}
.entry .lbadge{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;margin:0}
.refrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.refrow button{border:0;box-shadow:inset 0 0 0 1px var(--n-line-soft);background:var(--c-white);border-radius:var(--r-pill);padding:6px 14px;font-size:var(--fs-small)}
.refrow button:hover{background:var(--hover)}
.tip{margin-top:14px;background:var(--c-teal-20);border-radius:var(--r-step);padding:14px 16px}
.tip .h{font-size:12px;color:var(--c-gray-700);margin-bottom:4px}
.tip p{font-size:15px;font-weight:600}
.grp-h{font-size:var(--fs-small);color:var(--c-gray-700);margin:14px 0 4px}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{border:0;box-shadow:inset 0 0 0 1px var(--n-line-soft);background:var(--c-white);border-radius:var(--r-btn);padding:6px 12px;font-size:14px;min-width:44px}
.pick button.on{background:var(--c-teal-20);box-shadow:inset 0 0 0 1px var(--c-teal);font-weight:700}
.pick .tL{font-weight:800}
.field{margin-bottom:12px}
.field>label{display:block;font-size:var(--fs-small);color:var(--c-gray-700);margin-bottom:5px}
.hint{border:1px dashed var(--n-line);border-radius:var(--r-m);padding:14px;color:var(--c-gray-700)}
.panel{border:1px solid var(--n-line-soft);background:var(--c-white);border-radius:var(--r-step);padding:14px 16px;margin-top:10px}
.panel h3{font-size:15px;margin-bottom:6px}
.qwrap{max-width:680px}
.pbar{height:6px;background:var(--n-track);border-radius:var(--r-pill);overflow:hidden;margin:6px 0 16px}
.pbar i{display:block;height:100%;background:var(--c-mint)}
.qs{font-size:17px;font-weight:600;margin-bottom:14px}
.opts{display:grid;gap:6px}
.opt{position:relative;text-align:left;border:0;background:var(--n-surface);border-radius:var(--r-s);padding:11px 14px 11px 16px;font-size:15px;display:flex;gap:12px;align-items:flex-start}
.opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--n-bar);border-radius:var(--r-s) 0 0 var(--r-s)}
.opt .dot{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--n-control);background:var(--c-white);flex:none;margin-top:4px}
.opt.on{background:var(--c-mint-soft)}
.opt.on::before{width:5px;background:var(--c-teal)}
.opt.on .dot{background:var(--c-teal);box-shadow:none}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.bars{display:grid;gap:8px;margin:12px 0 16px}
.barrow{display:grid;grid-template-columns:28px 1fr 70px;gap:10px;align-items:center;font-size:14px}
.barrow .L{font-weight:800}
.barrow .tr{height:14px;background:var(--n-track);border-radius:7px;overflow:hidden}
.barrow .tr i{display:block;height:100%}
.barrow .pc{text-align:right;font-variant-numeric:tabular-nums}
.barrow.lead{font-weight:700}
.lead-box{border-radius:var(--r-step);padding:14px 16px;margin-bottom:10px}
.fmts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:760px}
.fmt{text-align:left;border:1px solid var(--n-line-soft);background:var(--c-white);border-radius:var(--r-step);padding:14px 16px}
.fmt:hover:not(:disabled){background:var(--hover)}
.fmt b{display:block;font-size:16px}
.fmt span{display:block;font-size:var(--fs-small);color:var(--c-gray-700)}
.fmt .best{margin-top:8px;font-size:12px}
.fmt .na{margin-top:4px;font-size:12px;color:var(--c-gray-700)}
.fmt:disabled{opacity:.55}
.tbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;color:var(--c-gray-700)}
.tbar b{color:var(--c-ink)}
.phrase{font-size:19px;font-weight:600;border-left:3px solid var(--c-teal);padding:6px 0 6px 14px;margin-bottom:16px;max-width:60ch}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:640px}
.tbtn{border:0;border-radius:var(--r-m);padding:14px;font-size:22px;font-weight:800}
.tbtn small{display:block;font-size:12px;font-weight:700}
.tbtn.D{background:var(--Dt);color:var(--D)}.tbtn.I{background:var(--It);color:var(--I)}.tbtn.S{background:var(--St);color:var(--S)}.tbtn.C{background:var(--Ct);color:var(--C)}
.tbtn:hover{box-shadow:inset 0 0 0 1px currentColor}
.verdict{border-radius:var(--r-step);padding:14px 16px;margin-bottom:12px}
.verdict.ok{background:var(--c-mint-44)} .verdict.bad{background:var(--c-red-20)}
.verdict h2{font-size:20px}
.expl{max-width:680px}
.expl p{margin-bottom:6px}
.board{display:grid;grid-template-columns:320px 1fr;gap:12px;align-items:stretch}
.tray,.bcol{border:1px dashed var(--n-line);border-radius:var(--r-m);padding:8px;min-height:120px;background:var(--n-surface)}
.tray h4,.bcol h4{margin:0 0 5px;font-size:var(--fs-small)}
.bcols{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bcol.D h4{color:var(--D)}.bcol.I h4{color:var(--I)}.bcol.S h4{color:var(--S)}.bcol.C h4{color:var(--C)}
.bcol.over,.tray.over{border-color:var(--c-teal);background:var(--c-white)}
.stm{background:var(--c-white);border:1px solid var(--n-line-soft);border-radius:var(--r-s);padding:5px 8px;font-size:var(--fs-small);line-height:1.35;margin-bottom:5px;cursor:grab}
.stm:active{cursor:grabbing}
.stm.good{border-color:var(--c-teal);background:var(--c-mint-44)}
.stm.bad{border-color:var(--c-red);background:var(--c-red-20)}
.stm .why{display:block;font-size:12px;font-weight:700;margin-top:3px}
.blist{display:grid;gap:6px;grid-template-columns:1fr 1fr}
.pairsel{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
.pairres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pairres .panel{margin-top:0}
.tour{max-width:560px;margin:40px auto 0}
.tour .k{font-size:var(--fs-small);color:var(--c-gray-700);margin-bottom:6px}
.tour h1{font-size:26px;margin-bottom:10px}
.tour p{font-size:17px}
.tour .dots{display:flex;gap:6px;margin:18px 0}
.tour .dots i{width:8px;height:8px;border-radius:50%;background:var(--n-line)}
.tour .dots i.on{background:var(--c-teal)}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.m-theory .main[data-screen="type"] > *,.m-theory .main[data-screen="compare"] > *{position:relative;z-index:1}

.m-theory .main[data-screen="type"] > *{flex-shrink:0}
.m-theory .tabbody.t3{flex:1 0 auto;display:flex;flex-direction:column}
.m-theory .tabbody.t3 .pager{margin-top:auto;padding-top:10px}
/* Правка «Как говорить»: «Список и разбор» */
.talk{display:grid;grid-template-columns:372px minmax(0,1fr);gap:28px;align-items:stretch;flex:0 0 auto;height:318px} /* высота как у вкладок «Кто это» и «В работе» — вертикальная линия везде одной длины и не доходит до низа слайда */
.tk-list{display:flex;flex-direction:column;gap:3px;align-self:start}
.tk-it{display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:none;border-radius:8px;padding:6px 10px;font-size:14px;line-height:1.4;color:var(--c-gray-700);transition:background .2s,color .2s,box-shadow .2s}
.tk-it:hover{background:var(--hover);color:var(--c-ink)}
.tk-it.on{background:var(--c-white);color:var(--c-ink);box-shadow:var(--sh-lift)}
.tk-no{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;line-height:1;color:var(--c-gray-700);box-shadow:inset 0 0 0 1px var(--n-line);transition:background .2s,color .2s,box-shadow .2s}
.tk-it.seen:not(.on) .tk-no{box-shadow:inset 0 0 0 1.5px var(--tkc);color:var(--c-ink)}
.tk-it.hint{animation:tkHintBg 1.8s ease-in-out 1.2s 3}
.tk-it.hint .tk-no{animation:tkHint 1.8s ease-in-out 1.2s 3}
@keyframes tkHintBg{0%,100%{background:transparent}50%{background:color-mix(in srgb,var(--tkc) 7%,transparent)}}
@keyframes tkHint{0%,100%{box-shadow:inset 0 0 0 1px var(--n-line),0 0 0 0 transparent}50%{box-shadow:inset 0 0 0 1.5px var(--tkc),0 0 0 5px color-mix(in srgb,var(--tkc) 16%,transparent)}}
.tk-it.on .tk-no{color:#fff;box-shadow:none}
.tk-pane{border-left:1px solid var(--n-line-soft);padding-left:28px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tk-c h4{margin:0 0 10px;font-size:15px;font-weight:800;line-height:1.4;color:var(--c-ink)}
.tk-ex{display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.tk-y,.tk-n{position:relative;border-radius:6px;padding:8px 12px 8px 15px}
.tk-y{background:var(--c-mint-44);color:var(--c-ink)}
.tk-n{background:var(--n-surface);color:var(--c-gray-700)}
.tk-y::before,.tk-n::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:6px 0 0 6px;background:var(--c-teal)}
.tk-n::before{background:var(--n-control)}
.tk-ex b{font-size:var(--fs-caption);text-transform:uppercase;letter-spacing:.2em;font-weight:800;margin-right:6px}
.tk-n b{color:var(--c-gray-700)}
.tk-c.fx{animation:fxTk .34s var(--ease) both}
.tk-c.out{opacity:0;transition:opacity .12s var(--ease-in)}
@keyframes fxTk{from{opacity:0;transform:translateY(6px)}}
.tk-note{margin-top:13px} /* под списком правил: 3px промежуток списка + 13px = 16px */
.m-theory .rules.paged{overflow:clip}
/* «Сравнение»: «Продолжить» прижата к низу, сноска к пятому аспекту её не сдвигает */
.m-theory .main[data-screen="compare"] .compare{display:flex;flex-direction:column;min-height:100%}
.m-theory .compare > .row:last-child{margin-top:auto!important;padding-top:14px;padding-bottom:15px} /* «Продолжить» на одном уровне с кнопками «О модели» */
.cols.measure{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;align-items:start}
.cols.measure .col{min-height:0}

/* ═════ Анимации (идеи 1–9) ═════
   Одна кривая для всех появлений, короткие уходы. Только transform и opacity. */
:root{--ease:cubic-bezier(.22,.8,.24,1);--ease-in:cubic-bezier(.4,0,1,1)}
@keyframes fxFade{from{opacity:0}}
@keyframes fxUp{from{opacity:0;transform:translateY(5px)}}

/* 4 · вкладки: полоса едет под выбранную, текст растворяется и появляется */
.tab-ink{position:absolute;left:0;bottom:-1px;width:1px;height:3px;background:var(--c-teal);transform-origin:0 0;transform:scaleX(0);pointer-events:none;transition:transform .36s var(--ease)}
.tabbody.out{opacity:0;transition:opacity .12s var(--ease-in)}
.tabbody.fx-in{animation:fxFade .28s var(--ease) both}

/* 5 · листание правил: уходят и приходят по направлению */
.rules .rule.out-f{opacity:0;transform:translateX(-24px);transition:opacity .16s var(--ease-in),transform .16s var(--ease-in)}
.rules .rule.out-b{opacity:0;transform:translateX(24px);transition:opacity .16s var(--ease-in),transform .16s var(--ease-in)}
.tabbody .note.out-f,.tabbody .note.out-b{opacity:0;transition:opacity .16s var(--ease-in)}
.rules.slide-f .rule{animation:fxSlideF .42s var(--ease) both}
.rules.slide-b .rule{animation:fxSlideB .42s var(--ease) both}
.rules.slide-f .rule:nth-child(2),.rules.slide-b .rule:nth-child(2){animation-delay:.04s}
.rules.slide-f .rule:nth-child(3),.rules.slide-b .rule:nth-child(3){animation-delay:.08s}
.rules.slide-f ~ .note,.rules.slide-b ~ .note{animation:fxFade .35s .12s var(--ease) both}
@keyframes fxSlideF{from{opacity:0;transform:translateX(28px)}}
@keyframes fxSlideB{from{opacity:0;transform:translateX(-28px)}}
.pager .dot{transition:background-color .25s var(--ease)}
.pager.fx .dot.on{animation:fxDot .32s var(--ease) both}
@keyframes fxDot{from{transform:scaleX(.41)}}

/* 6 · смена типа: старое растворяется, буква переворачивается, заголовок поднимается */
.card-hd.out{opacity:0;transition:opacity .12s var(--ease-in)}
.card-top.fx-sw .bigL{animation:fxFlip .5s var(--ease) both}
.card-top.fx-sw .card-hd h1,.card-top.fx-sw .card-hd .tl{animation:fxUp .34s .06s var(--ease) both}
.card-top.fx-sw .switcher button.on{animation:fxFade .3s var(--ease) both}
@keyframes fxFlip{from{opacity:0;transform:perspective(260px) rotateY(-80deg)}}

/* 1 · отметка прохождения «встаёт»: в шапке, на вкладке, на аспекте */
.chip .n{position:relative}
.chip.pop .n,.ok.pop{animation:fxCheck .5s var(--ease) both}
.chip.pop .n::after,.ok.pop::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px var(--c-mint);animation:fxRing .6s .12s ease-out both}
.ok{position:relative}
@keyframes fxCheck{0%{opacity:0;transform:perspective(80px) rotateY(90deg) scale(.7)}60%{opacity:1;transform:perspective(80px) rotateY(0) scale(1.08)}100%{transform:none}}
@keyframes fxRing{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.8)}}
/* …и в секторе схемы на главной */
.sq.just{animation:fxGlow 1s .3s ease-out both}
.sq.just .st{animation:fxStamp .45s .4s var(--ease) both;transform-origin:left center}
.sq.I.just .st,.sq.S.just .st{transform-origin:right center}
@keyframes fxGlow{0%{box-shadow:inset 0 0 0 0 currentColor}35%{box-shadow:inset 0 0 0 2px currentColor}100%{box-shadow:inset 0 0 0 0 transparent}}
@keyframes fxStamp{from{opacity:0;transform:scale(.6)}}

/* 2 · схема собирается при первом открытии главной за сеанс */
.quadbox.intro .sq{animation:fxSq .5s var(--ease) both}
.quadbox.intro .sq:nth-child(2){animation-delay:.08s}.quadbox.intro .sq:nth-child(3){animation-delay:.16s}.quadbox.intro .sq:nth-child(4){animation-delay:.24s}
.quadbox.intro .grid4::before{animation:fxLineV .55s .3s var(--ease) both}
.quadbox.intro .grid4::after{animation:fxLineH .55s .3s var(--ease) both}
.quadbox.intro .ax{animation:fxFade .4s .45s var(--ease) both}
.quadbox.intro .qlg{animation:fxFade .4s .6s var(--ease) both}
@keyframes fxSq{from{opacity:0;transform:scale(.94)}}
@keyframes fxLineV{from{transform:scaleY(0)}}
@keyframes fxLineH{from{transform:scaleX(0)}}

/* 3 · финал: сектора (на главной) и колонки (в «Сравнении») по очереди вспыхивают, шаги в шапке подпрыгивают, «Продолжить» оживает */
.quadbox.finale .sq,.cols.finale .col{animation:fxGlow .9s ease-out both}
.quadbox.finale .sq .L,.cols.finale .col .L{animation:fxHop .5s var(--ease) both}
.quadbox.finale .sq:nth-child(1),.quadbox.finale .sq:nth-child(1) .L,.cols.finale .col:nth-child(1),.cols.finale .col:nth-child(1) .L{animation-delay:.2s}
.quadbox.finale .sq:nth-child(2),.quadbox.finale .sq:nth-child(2) .L,.cols.finale .col:nth-child(2),.cols.finale .col:nth-child(2) .L{animation-delay:.34s}
.quadbox.finale .sq:nth-child(3),.quadbox.finale .sq:nth-child(3) .L,.cols.finale .col:nth-child(3),.cols.finale .col:nth-child(3) .L{animation-delay:.48s}
.quadbox.finale .sq:nth-child(4),.quadbox.finale .sq:nth-child(4) .L,.cols.finale .col:nth-child(4),.cols.finale .col:nth-child(4) .L{animation-delay:.62s}
@keyframes fxHop{45%{transform:translateY(-5px)}}
.steps.wave .chip .n{animation:fxHop .5s var(--ease) both;animation-delay:calc(var(--i) * .07s + .1s)}
.btn.wake{animation:fxWake 1.8s .8s ease-out both}
@keyframes fxWake{0%,100%{box-shadow:0 0 0 0 rgba(103,186,202,0)}20%{box-shadow:0 0 0 0 rgba(103,186,202,.5),var(--glow)}45%{box-shadow:0 0 0 10px rgba(103,186,202,0),var(--glow)}60%{box-shadow:0 0 0 0 rgba(103,186,202,.5),var(--glow)}85%{box-shadow:0 0 0 10px rgba(103,186,202,0),var(--glow)}}

/* 7 · подчёркивания прорисовываются по очереди (подчёркивание — фон, чтобы его можно было «вести» по строкам) */
.ab-txt .ref{text-decoration:none;--ul:var(--c-ink);background-image:linear-gradient(var(--ul),var(--ul));background-image:linear-gradient(color-mix(in srgb,var(--ul) 55%,transparent),color-mix(in srgb,var(--ul) 55%,transparent));background-repeat:no-repeat;background-position:0 100%;background-size:100% 2px;padding-bottom:2px} /* Правка «О модели»: подчёркивания 2px, цвет мягче, линия опущена ниже (padding-bottom у строчного элемента не меняет высоту строк) */
.ab-txt .uD{--ul:var(--D)}.ab-txt .uI{--ul:var(--I)}.ab-txt .uS{--ul:var(--S)}.ab-txt .uC{--ul:var(--C)}
.ab-body.draw .ref{animation:fxUl .7s cubic-bezier(.45,0,.2,1) both;animation-delay:calc(.45s + var(--i) * .3s)}
.ab-body.draw .tD,.ab-body.draw .tI,.ab-body.draw .tS,.ab-body.draw .tC{animation:fxInk .5s ease-out both;animation-delay:calc(.45s + var(--i) * .22s)}
@keyframes fxUl{from{background-size:0% 2px}}
@keyframes fxInk{from{color:var(--c-ink)}}

/* 8 · табло «1928» */
.odo{display:inline-flex;font-variant-numeric:tabular-nums}
.odo-d{display:inline-block;height:1em;overflow:hidden;line-height:1}
.odo-s{display:flex;flex-direction:column;transform:translateY(calc(var(--t) * -1em))}
.odo-s span{display:block;height:1em;line-height:1}
.odo.play .odo-s{animation:fxOdo cubic-bezier(.22,.9,.28,1) both;animation-duration:calc(1s + var(--k) * .3s);animation-delay:calc(.15s + var(--k) * .06s)}
@keyframes fxOdo{from{transform:translateY(0)}}

/* 9 · смена аспекта: тексты уходят и приходят волной D → C, буквы стоят */
.cols .col .v.out{opacity:0;transition:opacity .13s var(--ease-in)}
.cols.wave .col .v{animation:fxUp .36s var(--ease) both}
.cols.wave .col:nth-child(2) .v{animation-delay:.05s}.cols.wave .col:nth-child(3) .v{animation-delay:.1s}.cols.wave .col:nth-child(4) .v{animation-delay:.15s}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ═════ Буква летит между схемой и карточкой типа ═════ */
.fly{position:absolute;z-index:50;width:44px;height:44px;display:grid;place-items:center;font-family:var(--font);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1;border-radius:var(--r-m);pointer-events:none;will-change:transform}
.fly-hide{visibility:hidden}
.main.out{opacity:0;transition:opacity .15s var(--ease-in)}

/* ═════ Шапка карточки цвета типа ═════
   Все четыре угла одинаковые. Отрицательные поля компенсируют отступы, поэтому положение текста не меняется. */
.card-top{background:var(--ct-bg,transparent);border-radius:var(--r-step);margin:-8px -18px 4px;padding:12px 18px 12px}
.card-top.ct-D{--ct-bg:var(--Dt)}
.card-top.ct-I{--ct-bg:var(--It)}
.card-top.ct-S{--ct-bg:var(--St)}
.card-top.ct-C{--ct-bg:var(--Ct)}
.card-top.fx-sw{animation:fxFade .3s var(--ease) both}


/* ═════ ПРОТОТИП: шаги в шапке — одна система для всех шести шагов ═════
   Круг 21 px с содержимым: у типов — буква, у «О модели» и «Сравнения» — точка (пока не пройдено) и галочка.
   Состояния одинаковые у всех: закрыт — тонкий серый контур; открыт — тонкий мягкий контур цвета шага; пройден — мягкая заливка цвета шага;
   выбранный — только кольцо. Подложки и жирности у выбранного нет. */
.steps{gap:6px}
.steps .chip{gap:7px;padding:4px 6px 4px 4px;font-weight:400;-webkit-text-stroke:0}
.steps .chip,.steps .chip:hover,.steps .chip.here,.steps .chip.here:hover{background:none}
.steps .chip:not(:disabled):hover{background:var(--hover)}
.steps .chip.ty{--tc:var(--c-ink);--tf:var(--c-gray-300)}
.steps .chip.ty-D{--tc:var(--D);--tf:var(--Df)}
.steps .chip.ty-I{--tc:var(--I);--tf:var(--If)}
.steps .chip.ty-S{--tc:var(--S);--tf:var(--Sf)}
.steps .chip.ty-C{--tc:var(--C);--tf:var(--Cf)}
.steps .chip.nu{--tc:var(--c-gray-700);--fill:var(--c-mint)}
.steps .chip.ty{--fill:color-mix(in srgb,var(--tf) 30%,var(--c-white))}
.steps .chip .n{width:21px;height:21px;font-size:11px;font-weight:800;letter-spacing:0;background:none;color:var(--tc);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tc) 50%,transparent);outline:0 solid transparent;
  transition:background-color .3s var(--ease),box-shadow .3s var(--ease),outline-color .2s var(--ease)}
.steps .chip.done .n{background:var(--fill);box-shadow:none;color:var(--tc)}
.steps .chip.nu.done .n{color:var(--c-ink)}
.steps .chip.lock .n{color:var(--c-gray-300);box-shadow:inset 0 0 0 1px var(--c-gray-300)}
.steps .chip.nu .n:empty::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
/* выбранный: одно кольцо. У пройденного — на расстоянии 2 px от заливки, у ещё не пройденного — вплотную вместо контура */
.steps .chip.here .n{outline:1.5px solid color-mix(in srgb,var(--tc) 75%,transparent);outline-offset:0;box-shadow:none}
.steps .chip.here.done .n{outline-offset:2px}
.steps .chip.lock{color:var(--c-gray-300)}
.steps .chip.pop .n::after{box-shadow:0 0 0 2px var(--fill)}
.steps .chip.ty{padding:4px}


/* ═════ Воздух (960 × 540) ═════
   Отступы увеличены везде, где экран это выдерживает: проверено на всех экранах, прокрутки нет, блоки не прыгают.
   Только .m-theory; все значения подобраны по самому плотному экрану своей группы. */

/* шапка: между шагами и кнопками */
.m-theory .hd{gap:6px}
.m-theory .steps{gap:10px}

/* карточка типа: по горизонтали (высота шапки и вкладок не меняется — её держит страница «Как говорить») */
.m-theory .card-top{gap:20px;margin-left:-22px;margin-right:-22px;padding-left:22px;padding-right:22px}
.m-theory .card-hd{gap:16px}
.m-theory .tabs{gap:6px}
.m-theory .tabs button{padding-left:12px;padding-right:12px}
.m-theory .tabrow{gap:16px}
.m-theory .tabrow .card-actions{gap:10px}
.m-theory .switcher{gap:6px}
.m-theory .pager{gap:20px}

/* карточка типа, вкладки «Кто это» и «В работе» */
.m-theory .tabbody.t1,.m-theory .tabbody.t2{gap:36px;line-height:1.55;height:318px;flex:0 0 auto} /* Правка «Карточки»: высота одна на всех вкладках — линия одной длины; интерлиньяж 1.55 вместо 1.6, чтобы самый длинный текст поместился */
.m-theory .tabbody.t1 .tcol + .tcol,.m-theory .tabbody.t2 .tcol + .tcol{padding-left:30px}
.m-theory .tabbody h3{margin-bottom:12px}
.m-theory .tabbody p{margin-bottom:10px}
.m-theory .tabbody ul{margin-bottom:8px}
.m-theory .tabbody li{margin-bottom:6px}

/* главная */
.m-theory .home{gap:56px}
.m-theory .quad{gap:8px}
.m-theory .grid4{gap:6px}
.m-theory .sq{padding:14px}
.m-theory .qlg{margin-top:14px}
.m-theory .home h1{margin-bottom:14px}
.m-theory .home p.muted{margin-bottom:18px;color:var(--c-ink)} /* Правка «Цвет текста»: описание на главной — основным цветом текста, не серым */
.m-theory .counter{margin-bottom:22px}
.m-theory .entries{margin:8px 0 20px}
.m-theory .entry{padding:13px 10px}

/* сравнение */
.m-theory .compare h1{margin-bottom:14px}
.m-theory .compare .tabrow{margin-bottom:14px} /* Правка «Сборка теории»: вкладки как в карточках типов */
.m-theory .cols{gap:12px}
.m-theory .col{padding:16px}
.m-theory .cnote{margin-top:16px}

/* «О модели»: на первом шаге текст занимает всю высоту, поэтому только по горизонтали */
.m-theory .ab-prog{gap:6px}
.m-theory .ab-tx{padding-bottom:15px} /* Правка «О модели»: кнопки подняты от нижнего края; место одно на всех шагах, до текста самого длинного шага (01) остаётся ~22px */

/* выпадающее меню разделов */
.m-theory .menu{padding:6px}
.m-theory .menu button{padding:9px 12px}
.m-theory .menu hr{margin:6px 4px}

/* ═════ Экран «Справочник пройден» ═════ */
.app-fin{position:relative}
/* Правка «Финал»: красная линия снизу — как на главной, но без паттерна; паттерн (картинка автора) — в левом верхнем углу, тот же масштаб кубиков, что на главной */

.card-top.fx-sw .card-hero{animation:fxHeroIn .6s cubic-bezier(.3,.9,.3,1) both}
@keyframes fxHeroIn{from{opacity:0;transform:translateY(14px)}}

.card-hero .head,.card-hero .eyes{transition:transform .2s ease-out}
.card-hero .head{transform-origin:12px 22px}
.card-hero.back .head,.card-hero.back .eyes{transition:transform .6s ease-in-out}
.hero.card-hero.hD.cheer .hb{animation:ccD 1.5s ease-in-out both}
.hero.card-hero.hI.cheer .hb{animation:ccI 1.4s cubic-bezier(.45,0,.3,1) .1s both}
.hero.card-hero.hS.cheer .hb{animation:ccS 1.7s ease-in-out .1s both}
.hero.card-hero.hC.cheer .hb{animation:ccC 1.3s ease-in-out .1s both}
@keyframes ccD{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-16px) rotate(-4deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-16px) rotate(4deg)}}
@keyframes ccI{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes ccS{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-9px) scale(.98,1.02)}65%{transform:translateY(0) scale(1.04,.95)}}
@keyframes ccC{0%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}60%{transform:translateY(0)}78%{transform:translateY(-4px)}}
.hero-salute{position:absolute;width:0;height:0;pointer-events:none;z-index:30}

.hero-salute i:nth-child(even){left:-2px;top:-2px;width:4px;height:4px;background:var(--c-teal)}
@keyframes fxBurst{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1);opacity:0}}

.hero.run .face{transform:translateX(2.4px)}
.hero .lg.a{transform-origin:8px 22px}.hero .lg.b{transform-origin:16px 22px}
@keyframes hLeg{0%,100%{transform:rotate(32deg)}50%{transform:rotate(-32deg)}}
@keyframes hBob{0%,50%,100%{transform:translateY(0)}25%,75%{transform:translateY(-2.5px)}}
.hero{--st:.3s}
.hero.hD{--st:.36s}.hero.hI{--st:.52s}.hero.hS{--st:.9s}.hero.hC{--st:.62s}
.hero.run .lg.a{animation:hLeg var(--st) linear infinite}
.hero.run .lg.b{animation:hLeg var(--st) linear infinite;animation-delay:calc(var(--st) / -2)}
.hero.run .hb{animation:hBob var(--st) linear infinite}
.hero.hD.run .hs{transform:rotate(7deg)}
.hero.hD.run.left .hs{transform:scaleX(-1) rotate(7deg)}
@keyframes hJump{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-11px) rotate(5deg)}}
.hero.hI.run .hb{animation:hJump .72s cubic-bezier(.3,.1,.5,1) infinite}
.hero.hI.run .lg.a,.hero.hI.run .lg.b{animation-duration:.72s}

.hero.hI.idle .hb{animation:hBounce 1.1s ease-in-out infinite}
.hero.hS.idle .hb{animation:hSway 3.2s ease-in-out infinite}

.hero.hC.idle .face{animation:hLook 4.2s ease-in-out infinite}
.hero.hC.look .face{animation:hLook 1.6s ease-in-out infinite}

.hero.hD.cheer .hb{animation:cD 1.5s ease-in-out both}

.hero.hC.cheer .hb{animation:cC 1.3s ease-in-out .45s both}

/* ═════ Правка «Сборка теории»: «Сравнение» — шесть вкладок, сортировка карточек по типам ═════ */
.cmp-zone.fx-in,.cmp-note.fx-in{animation:fxFade .28s var(--ease) both}
.cmp-zone.out{opacity:0;transition:opacity .12s var(--ease-in)}
.cmp-hint{margin:0 0 8px;font-size:13px;line-height:1.5;color:var(--c-gray-700);height:20px;transition:opacity .35s}
.cmp-hint.off{opacity:0}
.cmp-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cmp-col{--tt:var(--Dt);--tc:var(--D);--tf:var(--Df);height:156px;border-radius:12px;background:var(--tt);padding:10px;display:flex;flex-direction:column;gap:6px;position:relative;outline:none;transition:background-color .2s,box-shadow .25s;min-width:0}
.cmp-col.D{--tt:var(--Dt);--tc:var(--D);--tf:var(--Df)}.cmp-col.I{--tt:var(--It);--tc:var(--I);--tf:var(--If)}.cmp-col.S{--tt:var(--St);--tc:var(--S);--tf:var(--Sf)}.cmp-col.C{--tt:var(--Ct);--tc:var(--C);--tf:var(--Cf)}
.cmp-ch{display:flex;align-items:baseline;height:20px;padding:0 2px}
.cmp-ch .L{font-size:20px;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--tc)}
.cmp-col:focus-visible{box-shadow:0 0 0 2px var(--c-ink)}
.cmp-picking .cmp-col{cursor:pointer}
.cmp-picking .cmp-col:hover{box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 45%,transparent)}
.cmp-slot,.cmp-stack{flex:1;min-height:0;border:1.5px dashed color-mix(in srgb,var(--tc) 40%,transparent);border-radius:9px;transition:background-color .2s,border-color .35s}
.cmp-slot{display:flex}
.cmp-stack{display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cmp-slot.full,.cmp-stack.full{border-color:transparent}
.cmp-col.over .cmp-slot,.cmp-col.over .cmp-stack{border-style:solid;background:rgba(255,255,255,.55)}
.cmp-col.hint .cmp-slot,.cmp-col.hint .cmp-stack{animation:cmpHintPulse 1s ease-in-out 2}
@keyframes cmpHintPulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--tf) 30%,transparent);border-color:var(--tf)}}
.cmp-col.bad{animation:cmpBad .65s ease}
@keyframes cmpBad{35%{background:color-mix(in srgb,var(--c-red) 14%,var(--tt))}}
.cmp-col.good{animation:cmpGood .85s ease}
@keyframes cmpGood{40%{box-shadow:0 0 0 5px color-mix(in srgb,var(--tf) 28%,transparent)}}
/* карточки */
.cmp-card{display:flex;align-items:center;width:100%;min-width:0;text-align:left;white-space:normal;font-family:inherit;color:var(--c-ink);background:var(--c-white);border:1px solid var(--n-line-soft);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.35;cursor:grab;box-shadow:0 1px 2px rgba(12,15,24,.05);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;transition:box-shadow .2s,translate .2s,border-color .35s,background-color .45s,padding .45s,font-size .45s;position:relative}
.cmp-card:hover{box-shadow:0 5px 14px rgba(12,15,24,.1);translate:0 -2px}
.cmp-card:focus-visible{outline:2px solid var(--c-ink);outline-offset:2px}
.cmp-card.sel{border-color:var(--c-teal);box-shadow:0 0 0 3px var(--c-teal-20),0 5px 14px rgba(12,15,24,.1);translate:0 -2px}
.cmp-card.drag{z-index:60;cursor:grabbing;box-shadow:0 14px 30px -8px rgba(12,15,24,.3);transition:none;translate:0 0}
.cmp-card.placed,.cmp-card:disabled{cursor:default;color:var(--c-ink);translate:0 0;box-shadow:0 1px 2px rgba(12,15,24,.06);border-color:transparent;pointer-events:none} /* клик по лежащей карточке проходит на колонку */
.cmp-card.shake{animation:cmpShake .42s ease}
@keyframes cmpShake{20%{translate:-6px 0}45%{translate:5px 0}70%{translate:-3px 0}}
.cmp-slot .cmp-card{height:100%}
/* результат: карточка «растворяется» в текст на цветной колонке */
.cmp-card.res{background:transparent;box-shadow:none;border-color:transparent;padding:2px 4px;font-size:15px;line-height:1.45;align-items:flex-start}
.cmp-card.chip.res{padding:2px 4px 2px 13px;font-size:12px;line-height:1.25;align-items:flex-start}
.cmp-card.chip.res::before{content:"";position:absolute;left:3px;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--tc)}
.cmp-zone2{height:110px;margin-top:8px}
.cmp-pool{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cmp-pc{height:110px}.cmp-pc .cmp-card{height:110px}
.cmp-vpool{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 12px}
.cmp-vpc{height:52px}
.cmp-card.chip{padding:4px 8px;font-size:12px;line-height:1.25;border-radius:8px;height:auto}
.cmp-vpc .cmp-card.chip{height:52px}
.cmp-note{margin:8px 0 0;font-size:13px;line-height:1.55;color:var(--c-ink);max-width:86ch} /* Правка «Цвет текста»: абзац внизу «Сравнения» — основным цветом текста */
.cmp-cols.finale .cmp-col{animation:fxGlow .9s ease-out both;color:var(--tc)}
.cmp-cols.finale .cmp-col .L{animation:fxHop .5s var(--ease) both}
/* когда собрано всё: колонка — кнопка (открывает карточку типа), при наведении подсвечивается, из-за её края выглядывает герой */
.cmp-all .cmp-cols.solved .cmp-col{cursor:pointer;transition:background-color .2s,box-shadow .25s,translate .25s}
.cmp-all .cmp-cols.solved .cmp-col:hover,.cmp-all .cmp-cols.solved .cmp-col:focus-visible{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--tc) 60%,transparent),0 8px 18px -8px rgba(12,15,24,.22);translate:0 -3px}
.cmp-pkw{display:none;position:absolute;right:8px;top:-38px;width:46px;height:38px;overflow:hidden;pointer-events:none}
.cmp-all .cmp-cols.solved .cmp-pkw{display:block}
.cmp-pk{position:absolute;left:8px;top:8px;width:30px;height:48px;transform:translateY(44px);transition:transform .35s ease-in}
.cmp-pk svg{display:block;width:30px;height:48px;overflow:visible}
.cmp-pk .head,.cmp-pk .eyes{transition:transform .2s ease-out}
.cmp-pk .head{transform-origin:12px 22px}
.cmp-all .cmp-cols.solved .cmp-col:hover .cmp-pk,.cmp-all .cmp-cols.solved .cmp-col:focus-visible .cmp-pk{transform:translateY(0);transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
</style>

  /* ── overlays ── */
  function overlays() {

        '<div class="acts"><button class="btn" data-act="modal-close">' + U.close + '</button></div></div></div>'; // Правка «Экскурсия»: кнопка повторного запуска убрана из «?»

      case 'home': return CFG.mode === 'full' ? viewHomeFull() : viewHomeTheory();

  function render() {
    var sc = S.ui.screen; // Правка «Без правой части шапки»: панели маршрута справа в шапке больше нет
    var m = root.querySelector('.main'), st = m ? m.scrollTop : 0;
    fxBefore();
    root.innerHTML = '<div class="app' + (sc === 'finish' ? ' app-fin' : '') + '">' + (sc === 'finish' ? '' : header()) + '<main class="main" data-screen="' + sc + '">' + mainView() + '</main>' + '</div>' + overlays(); // экран «Справочник пройден» — без шапки
    var m2 = root.querySelector('.main'); if (m2) m2.scrollTop = st;
    // Правка «О модели»: сцена отрисована в состоянии прошлого шага — в следующем кадре переключаем на текущий, чтобы сработали переходы
    var stg = root.querySelector('.ab-stage[data-to]');

    SES.aboutFrom = null;
    if (sc === 'type') mountHero(); // Правка «Герои»
    if (CFG.mode === 'theory' && sc === 'type') syncRuleHeight(); // Правка «Как говорить»: общая высота карточек правил
    fxAfter();
